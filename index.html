    <title>Alexandre Junior | Engenheiro Full Stack — ~/portfolio</title>

    <!-- Pre-hydration theme & palette script to avoid FOUC -->
    <script>
      ;(function () {
        try {
          var root = document.documentElement
          var storedMode = localStorage.getItem('portfolio_theme_mode')
          var storedPalette = localStorage.getItem('portfolio_theme_palette') || 'neon'
          var prefersLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches

          var mode = storedMode === 'light' || storedMode === 'dark' ? storedMode : prefersLight ? 'light' : 'dark'
          if (!storedMode) {
            mode = 'dark' // Escuro como padrão principal
          }

          root.classList.remove('light', 'dark')
          root.classList.add(mode)
          root.setAttribute('data-theme', mode)
          root.setAttribute('data-palette', storedPalette)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
